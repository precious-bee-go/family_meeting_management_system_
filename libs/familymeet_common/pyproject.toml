[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "familymeet-common"
version = "0.1.0"
description = "Shared code for the FamilyMeet services (errors, logging, settings, request id)"
requires-python = ">=3.10"
dependencies = ["fastapi", "pydantic>=2", "pydantic-settings>=2"]
[tool.setuptools.packages.find]
include = ["familymeet_common*"]
