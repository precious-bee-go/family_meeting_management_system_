name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
 
  test-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx -e libs/familymeet_common
      - run: python -m pytest
        working-directory: libs/familymeet_common
  test-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [services/members-meeting, services/debate, services/treasury, bff]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx -e libs/familymeet_common -r ${{ matrix.path }}/requirements.txt
      - run: python -m pytest
        working-directory: ${{ matrix.path }}
 
  build-images:
    runs-on: ubuntu-latest
    needs: [lint, test-common, test-services]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: members-meetings
            dockerfile: services/members-meeting/Dockerfile
          - name: debate
            dockerfile: services/debate/Dockerfile
          - name: treasury
            dockerfile: services/treasury/Dockerfile
          - name: bff
            dockerfile: bff/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} -t familymeet-${{ matrix.name }}:ci .

