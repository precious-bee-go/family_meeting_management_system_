services:
  members-meeting:
    build:
      context: .
      dockerfile: services/members-meeting/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  treasury:
    build:
      context: .
      dockerfile: services/treasury/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"
      ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  debate:
    build:
      context: .
      dockerfile: services/debate/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"
      ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s